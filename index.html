dialog{width:min(calc(100% - 28px),760px);max-height:calc(100% - 28px);max-height:calc(100dvh - 28px);overflow:auto;border:1px solid var(--line);border-radius:20px;padding:0;background:white;color:inherit;box-shadow:0 20px 64px #19243b40}dialog::backdrop{background:#14213d66}.dialogInner{padding:clamp(14px,4vw,26px)}.bar{display:flex;align-items:center;justify-content:space-between;gap:10px}.bar h2{font-size:clamp(1.2rem,4vw,1.65rem);line-height:1.2}.close{flex:0 0 44px;height:44px;background:#edf1f8;border:0;border-radius:11px;font-size:1.4rem;color:#43536b}.back{min-height:44px;border:0;background:none;color:var(--accent);font-weight:700;padding:0 4px;margin-top:4px}.search{margin:14px 0;display:block;width:100%;min-height:46px;padding:9px 12px;border:1px solid #cad4e5;border-radius:10px;background:#f8f9fc}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile{position:relative;display:block;text-align:left;min-height:74px;padding:13px 27px 13px 13px;border-radius:13px;border:1px solid var(--line);background:#f8fafd;color:#19243b;overflow-wrap:anywhere}.tile:hover{border-color:#bd6285;background:var(--pale)}.tile strong,.tile small{display:block}.tile strong{font-size:.98rem;line-height:1.27}.tile small{font-size:.86rem;line-height:1.38;color:var(--muted);margin-top:6px}.tile .arrow{position:absolute;right:10px;top:13px;color:var(--accent)}.tile.hot{border-color:#c58aa1;background:var(--pale)}.help{font-size:.88rem;color:var(--muted);margin:10px 0 0}.notice{margin-top:15px;border-radius:10px;background:#edf1f8;padding:11px 13px;color:#445572;font-size:.88rem}[hidden]{display:none!important}@media(max-width:360px){.tile{padding-left:9px;padding-right:19px}.tile .arrow{right:6px}.tile strong{font-size:.91rem}}

const flatten=(items,path=[])=>items.flatMap(item=>item.children?flatten(item.children,[...path,item.name]):[{...item,path}]);
const all=flatten(groups);
const $=id=>document.getElementById(id);
let stack=[],selected=null;
const modal=$('modal'),search=$('search'),tiles=$('tiles'),heading=$('heading'),back=$('back');
const el=(tag,text,cls)=>{const e=document.createElement(tag);if(text)e.textContent=text;if(cls)e.className=cls;return e};
const norm=s=>s.toLowerCase().replace(/ё/g,'е').trim();
function pick(item,path){selected={...item,path};$('picked').textContent=item.name;$('route').hidden=false;$('route').textContent=[...path,item.name].join(' → ');modal.close();}
function render(){
 const current=stack.at(-1), q=norm(search.value), path=stack.map(i=>i.name);
 const entries=q?all.filter(i=>q.split(/\s+/).every(x=>norm([i.name,i.d,i.terms,...i.path].join(' ')).includes(x))):current?current.children:groups;
 heading.textContent=q?'Результаты поиска':current?current.name:'Выберите группу';
 back.hidden=!stack.length&&!q;
 back.textContent=q?'← Очистить поиск':stack.length===1?'← Все группы':'← '+stack.at(-2)?.name;
 tiles.replaceChildren();
 if(!entries.length)tiles.append(el('p','Нет тем по этому запросу.','help'));
 for(const item of entries){
  const button=el('button',null,'tile'+(item.hot?' hot':''));button.type='button';
  button.append(el('strong',item.name));
  const sub=q?[item.path.at(-1),item.d].filter(Boolean).join(' · '):current?item.d:'';
  if(sub)button.append(el('small',sub));
  const arrow=el('span',item.children?'›':'↵','arrow');arrow.setAttribute('aria-hidden','true');button.append(arrow);
  button.onclick=()=>{if(item.children){stack.push(item);search.value='';render();heading.focus();}else pick(item,item.path||path)};
  tiles.append(button);
 }
}
$('pick').onclick=()=>{stack=[];search.value='';render();modal.showModal();heading.focus()};
$('close').onclick=()=>modal.close();
modal.addEventListener('close',()=>$('pick').focus());
back.onclick=()=>{if(search.value)search.value='';else stack.pop();render();heading.focus()};
search.addEventListener('input',render);
